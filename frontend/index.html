<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- dot wave background canvas -->
<canvas id="dot-canvas"></canvas>

<!-- block transition overlay -->
<div id="block-overlay"></div>

<!-- landing info: OS + time — hidden when chat opens -->
<div id="landing-info">
  <span id="landing-time"></span>
  <span class="sep">on</span>
  <span id="landing-os"></span>
</div>

<!-- ════════════════════════════════════════
     LANDING PAGE
════════════════════════════════════════ -->
<div id="landing">
  <div class="logo-group">
    <svg id="landing-heart" class="heart-flicker" width="90" height="90" viewBox="0 0 14 13" fill="var(--accent)" style="image-rendering:pixelated" shape-rendering="crispEdges">
      <rect x="1" y="0" width="4" height="1"/>
      <rect x="9" y="0" width="4" height="1"/>
      <rect x="0" y="1" width="6" height="1"/>
      <rect x="8" y="1" width="6" height="1"/>
      <rect x="0" y="2" width="14" height="1"/>
      <rect x="0" y="3" width="14" height="1"/>
      <rect x="0" y="4" width="14" height="1"/>
      <rect x="1" y="5" width="12" height="1"/>
      <rect x="2" y="6" width="10" height="1"/>
      <rect x="3" y="7" width="8"  height="1"/>
      <rect x="4" y="8" width="6"  height="1"/>
      <rect x="5" y="9" width="4"  height="1"/>
      <rect x="6" y="10" width="2" height="1"/>
      <!-- highlight dots -->
      <rect x="2" y="1" width="1" height="1" fill="rgba(30,60,120,0.90)"/>
      <rect x="3" y="2" width="1" height="1" fill="rgba(20,40,90,0.70)"/>
      <rect x="10" y="1" width="1" height="1" fill="rgba(30,60,120,0.90)"/>
      <rect x="9"  y="2" width="1" height="1" fill="rgba(20,40,90,0.70)"/>
    </svg>
    <div class="logo-wl">WL</div>
  </div>
  <p class="tagline">something that listens.</p>
  <button id="begin-btn">begin</button>
</div>

<!-- ════════════════════════════════════════
     CHAT PAGE
════════════════════════════════════════ -->
<div id="chat-page" style="display:none">

  <header id="topbar">
    <div id="topbar-logo">
      <svg width="22" height="22" viewBox="0 0 14 13" fill="var(--accent)" style="image-rendering:pixelated" shape-rendering="crispEdges">
        <rect x="1" y="0" width="4" height="1"/>
        <rect x="9" y="0" width="4" height="1"/>
        <rect x="0" y="1" width="6" height="1"/>
        <rect x="8" y="1" width="6" height="1"/>
        <rect x="0" y="2" width="14" height="1"/>
        <rect x="0" y="3" width="14" height="1"/>
        <rect x="0" y="4" width="14" height="1"/>
        <rect x="1" y="5" width="12" height="1"/>
        <rect x="2" y="6" width="10" height="1"/>
        <rect x="3" y="7" width="8"  height="1"/>
        <rect x="4" y="8" width="6"  height="1"/>
        <rect x="5" y="9" width="4"  height="1"/>
        <rect x="6" y="10" width="2" height="1"/>
        <rect x="2"  y="1" width="1" height="1" fill="rgba(30,60,120,0.90)"/>
        <rect x="3"  y="2" width="1" height="1" fill="rgba(20,40,90,0.70)"/>
        <rect x="10" y="1" width="1" height="1" fill="rgba(30,60,120,0.90)"/>
        <rect x="9"  y="2" width="1" height="1" fill="rgba(20,40,90,0.70)"/>
      </svg>
    </div>

    <div id="topbar-clock"></div>

    <div class="gender-wrap">
      <button class="g-btn active" data-g="female">F</button>
      <button class="g-btn" data-g="male">M</button>
    </div>

    <!-- Camera toggle -->
    <button id="cam-toggle-btn" title="toggle camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 7l-7 5 7 5V7z"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
    </button>

    <!-- Mic button — actual microphone icon -->
    <button id="mic-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="11" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="8"  y1="22" x2="16" y2="22"/>
      </svg>
    </button>
  </header>

  <div id="main">

    <div id="left-panel" class="side-panel"></div>

    <div id="chat-center">
      <div id="messages">
        <div id="empty-state">say something.</div>
      </div>
      <div id="input-row">
        <textarea id="user-input" placeholder="..." rows="1" spellcheck="false" autocomplete="off"></textarea>
        <button id="send-btn">→</button>
      </div>
    </div>

    <div id="right-panel" class="side-panel">
      <!-- cam-container: shared for both manual and challenge mode -->
      <div id="cam-container">
        <div id="cam-wrap">
          <video id="cam-video" autoplay muted playsinline></video>
        </div>
        <!-- smile-meter: only visible when challenge-mode class is on cam-container -->
        <div id="smile-meter">
          <div class="meter-col">
            <div class="meter-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/>
                <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke-linecap="round"/>
                <circle cx="9"  cy="9" r="0.6" fill="currentColor" stroke="none"/>
                <circle cx="15" cy="9" r="0.6" fill="currentColor" stroke="none"/>
              </svg>
            </div>
            <div id="smile-bar-outer">
              <div class="bar-tick" style="bottom:75%"></div>
              <div class="bar-tick" style="bottom:50%"></div>
              <div class="bar-tick" style="bottom:25%"></div>
              <div id="hold-ring"></div>
              <div id="smile-bar-fill"></div>
            </div>
            <div class="meter-label">smile</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="app.js"></script>
<script src="chat.js"></script>
<script src="tts-stt.js"></script>
<script src="emotion.js"></script>
</body>
</html>
